[build]
  base    = "frontend"
  command = "next build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # После деплоя Railway — заменить на реальный URL бэкенда
  NEXT_PUBLIC_API_URL = "https://winextraflow-production.up.railway.app"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
