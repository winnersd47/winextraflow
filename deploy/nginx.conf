# WinExtraFlow — nginx reverse proxy for the FastAPI backend.
# Place at /etc/nginx/sites-available/winextraflow and symlink into sites-enabled.
# TLS is issued by certbot (see deploy/DEPLOY.md).

upstream wef_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Rate limit: protects auth + webhooks from abuse (app also has its own limiter).
limit_req_zone $binary_remote_addr zone=wef_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=wef_api:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.winextraflow.ru;          # <-- replace with your API domain

    # ACME challenge for certbot, everything else -> HTTPS
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.winextraflow.ru;          # <-- replace with your API domain

    ssl_certificate     /etc/letsencrypt/live/api.winextraflow.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.winextraflow.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Security headers (the app sets its own too; these cover error pages)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 12m;                 # KYC photo uploads
    access_log /var/log/nginx/wef.access.log;
    error_log  /var/log/nginx/wef.error.log;

    # WebSocket: live signal feed
    location /api/v1/ws {
        proxy_pass http://wef_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Stricter limit on auth endpoints
    location /api/v1/auth/ {
        limit_req zone=wef_auth burst=5 nodelay;
        proxy_pass http://wef_api;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=wef_api burst=40 nodelay;
        proxy_pass http://wef_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ── Frontend on the same host ───────────────────────────────────────────────
#
# Why this exists: winextraflow.pages.dev serves correctly (HTTP 200, right page)
# but is unreachable from the target audience's networks. Measured from the
# operator's connection in Russia:
#
#   direct         winextraflow.pages.dev            -> connection closed (curl 000)
#   direct         fb91d1d3.winextraflow.pages.dev   -> connection closed (curl 000)
#   direct         www.cloudflare.com                -> 200      (Cloudflare itself is fine)
#   via SOCKS5     winextraflow.pages.dev            -> 200 in 0.5s
#
# So the block is specific to the *.pages.dev hostname, not to Cloudflare or to
# the deployment. A frontend nobody in the target market can open is not a
# frontend, so the static export is served from this server as the primary and
# Pages stays as a mirror for everyone else.
#
# Build:  cd frontend && build-pages.bat https://api.winextraflow.ru
# Deploy: rsync -a --delete frontend/out/ root@SERVER:/var/www/winextraflow/
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name winextraflow.ru www.winextraflow.ru;   # <-- your public domain

    ssl_certificate     /etc/letsencrypt/live/winextraflow.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/winextraflow.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/winextraflow;
    index index.html;

    access_log /var/log/nginx/wef.front.access.log;
    error_log  /var/log/nginx/wef.front.error.log;

    # Hashed build assets are immutable; HTML must not be cached or a deploy
    # leaves clients on the previous bundle.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Same-origin API and WebSocket: no CORS, and NEXT_PUBLIC_API_URL can stay
    # empty in the build, which also keeps ws.ts on the same host.
    location /api/ {
        limit_req zone=wef_api burst=40 nodelay;
        proxy_pass http://wef_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Static export writes /page/index.html — try the directory before 404.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name winextraflow.ru www.winextraflow.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
